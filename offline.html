<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexion | El Valle</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Trebuchet MS", "Gill Sans", sans-serif;
      background: radial-gradient(circle at top right, #d9f6ef 0%, #edf4ff 45%, #e9efff 100%);
      color: #24163d;
      padding: 24px;
    }
    main {
      max-width: 520px;
      background: #fdfcff;
      border: 1px solid #cfe2ff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 18px 40px rgba(72, 42, 129, 0.16);
    }
    h1 { margin: 0 0 10px; }
    p { margin: 0 0 8px; opacity: 0.85; }
  </style>
</head>
<body>
  <main>
    <h1>Estas sin conexion</h1>
    <p>La app sigue funcionando en modo local.</p>
    <p>Cuando vuelvas a tener internet, sincronizaremos tus cambios automaticamente.</p>
  </main>
</body>
</html>
